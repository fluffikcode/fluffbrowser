[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fluffbrowser"
dynamic = ["version"]
description = "A cosy terminal cockpit for an AI agent that drives a real browser."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FluffBrowser contributors" }]
keywords = ["ai", "browser", "agent", "automation", "llm", "rich", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "browser-use>=1.0.0",
    "playwright>=1.49.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[project.scripts]
fluffbrowser = "fluffbrowser.app:main"

[tool.setuptools]
packages = ["fluffbrowser", "fluffbrowser.core", "fluffbrowser.ui"]

[tool.setuptools.dynamic]
version = { attr = "fluffbrowser.__version__" }

[tool.setuptools.package-data]
fluffbrowser = ["assets/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM105", # try/except/pass is sometimes clearer than contextlib.suppress
]

[tool.ruff.lint.isort]
known-first-party = ["fluffbrowser"]
