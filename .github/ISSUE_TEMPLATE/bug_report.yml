name: Bug report
description: Something broke, looked wrong, or refused to launch.
title: "[bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **never paste your API key** — mask it as `sk-***`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The exact error panel text or behaviour you saw.
      placeholder: The browser opened, then the task panel showed "404 Not Found".
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set BASE_URL to ...
        2. Run run.bat
        3. Type ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2 / macOS 14.5 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: browser-use
    attributes:
      label: browser-use version
      description: Output of `pip show browser-use`.
      placeholder: "1.0.6"
    validations:
      required: false
  - type: dropdown
    id: model
    attributes:
      label: LLM provider
      options:
        - LM Studio
        - Ollama
        - vLLM / llama.cpp
        - OpenAI
        - OpenRouter
        - Other OpenAI-compatible endpoint
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Copy the terminal output. Remove keys, tokens and personal data.
      render: shell
    validations:
      required: false
